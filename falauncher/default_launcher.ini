; ============================================================================
;  FA Secure Launcher configuration
;  Created automatically during setup. It lives in the 'launcher' folder
;  inside your game folder (e.g. C:\Games\FA42\launcher), next to
;  fa_launcher.exe.
; ============================================================================

[Launcher]

; The server login page shown in the embedded browser window.
LoginUrl=http://fa-re-srv.ddns.net/login

; Arguments appended after  /NET /Name:<pid>  when launching the client.
; DO NOT MODIFY!!!!!!
LaunchArgs=/MK:0 "/MCD1:0 /MCD2:0 /MTD:0 /NoPreload /PPS:5 /FPS:50 /SDM:1000"

; Size of the launcher window (the embedded login browser).
WindowWidth=460
WindowHeight=640

; ----------------------------------------------------------------------------
; Everything below is optional and set/managed by the launcher itself.
; GameDir / ClientExe / GameInstalled are written automatically after the
; game is downloaded and installed.
; ----------------------------------------------------------------------------

; The game downloads from the project's maintained mirror list (fetched fresh
; each time). Normally leave this alone.
;MirrorListUrl=https://raw.githubusercontent.com/alon-ant/FighterAceREsurrection/main/falauncher/mirrors.txt

; The game folder chosen during setup is recorded below automatically and
; used by the installer without asking again.
